[project]
name = "dataset-worker"
version = "0.0.0"
description = "Model Training Platform — dataset scan worker"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "minio>=7.2",
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[project.scripts]
dataset-worker = "dataset_worker.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_worker"]
