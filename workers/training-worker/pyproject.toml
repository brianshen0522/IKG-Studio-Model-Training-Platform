[project]
name = "training-worker"
version = "0.0.0"
description = "YOLO Trainer — Ultralytics training worker"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "minio>=7.2",
  "ultralytics>=8.3",
  "torch>=2.2",
  "torchvision>=0.17",
  "openvino>=2024.0.0",
]

# CPU-only torch: there is no GPU passthrough in Docker on macOS, and the default
# torch wheel drags in a multi-GB CUDA/nvidia stack that is pure dead weight there.
# Pin torch/torchvision to the PyTorch CPU index (no nvidia-* deps). For a real GPU
# host, drop these overrides (or use a CUDA build) alongside docker-compose.gpu.yml.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
training-worker = "training_worker.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_worker"]
