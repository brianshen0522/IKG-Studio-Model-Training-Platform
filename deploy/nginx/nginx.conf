# Preserve the scheme tls-proxy actually terminated (https) instead of overwriting it
# with this container's own $scheme, which is always http (tls-proxy talks to us over
# plain HTTP on the internal network).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 500m;

  # Docker's embedded DNS. Without a resolver, nginx looks the backend up once at
  # startup and caches the address forever — recreating the backend container then
  # returns 502 until nginx itself is restarted. Passing the upstream through a
  # variable forces a fresh lookup per request, honouring this TTL.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /api/v1/events/ {
    set $backend_sse http://backend:3000;
    proxy_pass $backend_sse;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }

  location /downloads/ {
    set $backend_dl http://backend:3000;
    proxy_pass $backend_dl;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  # Browsers request /favicon.ico implicitly even when index.html declares icons. The
  # SPA fallback below would answer it with index.html (200 text/html), which the
  # browser cannot decode and caches as "no icon" — sticky enough to survive reloads.
  # Serve the real raster instead; Chrome sniffs the type, so PNG-at-.ico is fine.
  location = /favicon.ico {
    root /usr/share/nginx/html;
    try_files /favicon-32.png =404;
    access_log off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
