# TLS-terminating reverse proxy — the ONLY container that publishes a host port.
# Self-signed cert (see tls-entrypoint.sh), so this is deliberately IP-agnostic: any
# client IP works, browsers just show a self-signed warning to click through (there is
# no such thing as a certificate valid for "every IP" — SAN entries are an explicit
# list, not a wildcard, so we don't try to fake one).

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # A plain-HTTP request hitting this TLS port raises nginx's internal 497 (rendered
  # as a bare 400 by default); bounce it to the same URL over https instead. $http_host
  # keeps the port the client actually used, so non-443 WEB_HTTPS_PORT values survive.
  error_page 497 =301 https://$http_host$request_uri;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  client_max_body_size 500m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    set $web_upstream http://web:80;
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }

  # SSE stream: no buffering, long-lived connection.
  location /api/v1/events/ {
    set $web_sse http://web:80;
    proxy_pass $web_sse;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }
}

# A bare request to the console origin: no Authorization header and no query
# string, i.e. a person opening the address. A signed S3 call always carries
# one or the other (header, or a presigned query). Not $arg_X-Amz-Signature:
# nginx variable names stop at the hyphen.
map "$http_authorization$args" $console_unsigned {
  ""      1;
  default 0;
}

# The RustFS web console, on a port of its own (S3_CONSOLE_PORT, published as
# 9001). It cannot live under a path of the app's origin: the console takes the
# address in the URL bar as the address of the storage API itself and lists
# buckets with GET / on it, which here is the app's home page. So it gets a
# whole origin, and everything on it goes to RustFS's console listener, which
# serves the console, its admin API and S3. Same as the Dataset Manager.
#
# The console signs its S3 requests in the browser for the host it was opened
# on, so the Host header goes through verbatim, port included.
server {
  listen 9001 ssl;
  http2 on;
  server_name _;

  error_page 497 =301 https://$http_host$request_uri;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Relative Location headers: nginx would otherwise write its own listen port
  # (9001) into redirects, which is wrong whenever S3_CONSOLE_PORT is not 9001.
  absolute_redirect off;

  # Uploads from the console go straight to storage; RustFS has its own limits.
  client_max_body_size 0;

  # Resolved per request, like web above, so tls-proxy still starts (and the app
  # still serves) while the object store is down or being recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # The console UI lives under /rustfs/console/; / on this origin is the S3
  # API, which answers a browser with an XML 403. Send people to the UI, and
  # leave signed calls (the console lists buckets with a signed GET /) alone.
  location = / {
    if ($console_unsigned) {
      return 302 /rustfs/console/;
    }
    set $console_upstream http://objectstore:9001;
    proxy_pass $console_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    set $console_upstream http://objectstore:9001;
    proxy_pass $console_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $http_connection;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
  }
}
