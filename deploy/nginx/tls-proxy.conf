# TLS-terminating reverse proxy — the ONLY container that publishes a host port.
# Self-signed cert (see tls-entrypoint.sh), so this is deliberately IP-agnostic: any
# client IP works, browsers just show a self-signed warning to click through (there is
# no such thing as a certificate valid for "every IP" — SAN entries are an explicit
# list, not a wildcard, so we don't try to fake one).

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  client_max_body_size 500m;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    set $web_upstream http://web:80;
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }

  # SSE stream: no buffering, long-lived connection.
  location /api/v1/events/ {
    set $web_sse http://web:80;
    proxy_pass $web_sse;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }
}
