# TLS-terminating reverse proxy — the ONLY container that publishes a host port.
# Self-signed cert (see tls-entrypoint.sh), so this is deliberately IP-agnostic: any
# client IP works, browsers just show a self-signed warning to click through (there is
# no such thing as a certificate valid for "every IP" — SAN entries are an explicit
# list, not a wildcard, so we don't try to fake one).
#
# One port serves everything: the app, and the RustFS web console at /rustfs/console/.

# Requests that belong to RustFS rather than the app. The console cannot simply
# live under a path: it treats the address in the URL bar as the S3 API and sends
# its S3 calls to this same origin — GET / to list buckets, /<bucket>/<key> for
# objects — paths the app owns. What sets those calls apart is that every one is
# AWS-signed, in the Authorization header or as a presigned query, and the app
# never sends either (it authenticates with a session cookie). So: signed
# requests and the console's own /rustfs/ tree go to RustFS, the rest to the app.
map $http_authorization $s3_signed_header {
  "~^AWS4-HMAC-SHA256 " 1;
  default               0;
}
map $args $s3_signed_query {
  "~(^|&)X-Amz-Signature=" 1;
  default                  0;
}
map "$s3_signed_header$s3_signed_query" $to_objectstore {
  "00"    0;
  default 1;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # A plain-HTTP request hitting this TLS port raises nginx's internal 497 (rendered
  # as a bare 400 by default); bounce it to the same URL over https instead. $http_host
  # keeps the port the client actually used, so non-443 WEB_HTTPS_PORT values survive.
  error_page 497 =301 https://$http_host$request_uri;

  ssl_certificate     /etc/nginx/tls/cert.pem;
  ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # No limit here: the app's 500 MB cap is enforced by web's own nginx, and
  # uploads from the RustFS console go straight to storage, which has its own.
  client_max_body_size 0;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    # Upstreams are variables so they are resolved per request: tls-proxy starts,
    # and the app keeps serving, while the object store is down or being
    # recreated. $request_uri is passed verbatim because S3 signatures cover the
    # exact path and query; a normalised URI would fail them for some keys.
    #
    # Host: the app gets $host as it always has; RustFS gets the header verbatim,
    # port included, because the console signs for the host it was opened on.
    set $upstream web:80;
    set $upstream_host $host;
    if ($to_objectstore) {
      set $upstream objectstore:9001;
      set $upstream_host $http_host;
    }
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }

  # The RustFS console UI and its admin API. Its listener on 9001 also serves S3,
  # which is where the signed requests above go.
  location /rustfs/ {
    set $console_upstream objectstore:9001;
    proxy_pass http://$console_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SSE stream: no buffering, long-lived connection.
  location /api/v1/events/ {
    set $web_sse http://web:80;
    proxy_pass $web_sse;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }
}
