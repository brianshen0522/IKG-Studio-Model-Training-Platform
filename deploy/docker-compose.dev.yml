services:
  backend:
    build:
      target: development
    volumes:
      - ../apps/api/src:/app/src:ro
      - ../packages:/app/packages:ro
    command: nest start --watch

  # Serve the locally built SPA instead of the copy baked into the image, so a
  # `pnpm --filter web build` shows up without rebuilding the container.
  #
  # This block said `nginx` before, which is not a service in this project (the
  # SPA container is `web`). Compose rejects the whole file for an unknown
  # service, so `-f docker-compose.dev.yml` could never start anything.
  web:
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  # Only the S3 API. RustFS's console on 9001 is disabled in docker-compose.yml,
  # so nothing listens there.
  objectstore:
    ports:
      - "9000:9000"

# Dev only: allow host access to infra ports (prod keeps the internal-network
# isolated).
networks:
  internal-network:
    internal: false
